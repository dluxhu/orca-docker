name: build

# Every push and pull request: build the amd64 image and run the end-to-end
# smoke test. Push to main and v* tags: also build amd64 + arm64 and publish to
# GHCR (ghcr.io/<owner>/orca-docker), so a NAS pulls the right one.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orca-docker

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck entrypoint.sh healthcheck.sh orca-pairing install-agents test/smoke.sh bin/bump-orca

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64, loaded for the test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: orca-docker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: test/smoke.sh orca-docker:test

  publish:
    needs: test
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read the Orca version
        id: orca
        run: echo "version=$(sed -n 's/^ARG ORCA_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3       # arm64 build on the amd64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=orca-${{ steps.orca.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
